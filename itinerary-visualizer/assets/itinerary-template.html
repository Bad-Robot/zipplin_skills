<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>__TITLE__ · 行程地图</title>
  <style>
    :root{--paper:#f7f1e5;--canvas:#e8e9dc;--ink:#294d3b;--muted:#748070;--route:#c45c38;--teal:#3b7c78;--stay:#2874a6;--line:#d7d6bf;--white:#fffdf7;--map-h:0px;color-scheme:light}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.65}button,a{font:inherit}button{color:inherit}.page{max-width:1180px;margin:auto;background:var(--paper);min-height:100vh;box-shadow:0 0 48px #40563e16}.hero{padding:34px clamp(18px,4vw,54px) 28px;background:linear-gradient(150deg,#faf6ea,#edf0df);border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.28em;color:#9a754f;text-transform:uppercase}.hero-row{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-top:8px}.hero h1{font:700 clamp(29px,5vw,52px)/1.12 Georgia,"Songti SC",serif;margin:0;letter-spacing:.02em}.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:1px solid #b8c5b3;background:#fffaf0;border-radius:999px;padding:8px 14px;cursor:pointer}.action:hover{background:#eef2e7}.stats{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap}.stat strong{display:block;font:28px Georgia,serif;color:var(--route)}.stat span{font-size:11px;color:var(--muted)}
    .map-placeholder{display:none;width:100%}.map-placeholder.active{display:block}.map-section{position:relative;z-index:30;width:100vw;margin-left:calc(50% - 50vw);background:#fffdf7;border-bottom:1px solid #dedbc8;box-shadow:0 3px 14px #3d50341c}.map-section.stuck{position:fixed;inset:0 0 auto;margin:0}.map-viewport{position:relative;width:min(100vw,1200px);aspect-ratio:3/2;margin:auto;overflow:hidden;background:var(--paper);touch-action:pan-y;cursor:zoom-in}.map-section.stuck .map-viewport{width:100vw;height:min(66.6667vw,62vh);aspect-ratio:auto;cursor:grab;touch-action:none}.map-section.stuck .map-viewport:active{cursor:grabbing}.map-stage{position:absolute;inset:0 auto auto 0;width:100%;aspect-ratio:3/2;transform-origin:0 0;will-change:transform}.map-stage.animating{transition:transform .36s cubic-bezier(.2,.82,.3,1)}.map-stage svg{display:block;width:100%;height:100%;pointer-events:none}.geo{transition:opacity .28s ease,filter .28s ease}.geo.dimmed{opacity:.18}.geo.active{opacity:1;filter:drop-shadow(0 0 4px #d16c3e50)}.lodging-node.active{filter:drop-shadow(0 0 6px #2874a6aa)}.distance-label.dimmed{opacity:.35}.map-tools{position:absolute;left:10px;top:10px;z-index:2;display:grid;gap:6px}.map-tools button{width:34px;height:34px;border-radius:10px;border:1px solid #cdbb99;background:#fffaf0e8;box-shadow:0 2px 7px #745b3520;font-size:18px;font-weight:700;cursor:pointer}.map-tools button:active{transform:scale(.94)}.map-badge{position:absolute;right:10px;bottom:10px;background:#fffaf0e8;border:1px solid #d8c8aa;border-radius:9px;padding:3px 8px;font-size:10px;color:#825f32}.map-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#253c31c9;color:#fff;border-radius:99px;padding:3px 10px;font-size:10px;white-space:nowrap;transition:opacity .4s}.map-hint.hidden{opacity:0}.day-nav{display:flex;gap:6px;overflow:auto;padding:8px 12px;background:#fffdf7;border-top:1px solid #e5dfcd;scrollbar-width:thin}.day-pill{flex:0 0 auto;border:1px solid #e6c79f;background:#fff5e5;color:#7f531e;border-radius:99px;padding:5px 11px;font-size:11px;cursor:pointer;scroll-snap-align:center}.day-pill.active{background:var(--route);border-color:var(--route);color:white;box-shadow:0 2px 6px #a94d2d45}
    main{padding:24px clamp(12px,3vw,34px) 44px}.preview-warning{display:none;margin:0 0 18px;padding:12px 15px;background:#fff0cf;border:1px solid #e9bd68;border-radius:10px;color:#775019;font-size:13px}.preview-warning.show{display:block}.day-card{scroll-margin-top:calc(var(--map-h) + 12px);background:var(--white);border:1px solid #dedbc8;border-radius:16px;margin:0 0 22px;overflow:hidden;box-shadow:0 5px 18px #42523a10}.day-head{padding:18px 20px;background:linear-gradient(135deg,#fdf5e5,#f4ead3);border-left:5px solid var(--day-color,var(--route));display:flex;gap:18px;align-items:start;justify-content:space-between}.day-kicker{font-size:10px;letter-spacing:.17em;color:#9b7046}.day-head h2{font:700 24px/1.25 Georgia,"Songti SC",serif;margin:3px 0}.day-summary{font-size:12px;color:var(--muted)}.day-total{text-align:right;white-space:nowrap}.day-total strong{font:26px Georgia,serif;color:var(--day-color,var(--route));display:block}.day-total span{font-size:10px;color:var(--muted)}.legs{padding:12px 18px;background:#fffbf2;border-top:1px solid #eee1c6;border-bottom:1px solid #eee1c6}.legs-title{font-size:11px;font-weight:700;color:#815127;display:flex;justify-content:space-between;gap:12px}.leg-list{display:flex;gap:7px;overflow:auto;padding-top:8px}.leg{flex:0 0 auto;border:1px solid #ead0a9;border-radius:9px;padding:5px 9px;background:#fff;font-size:10.5px;color:#5d4b36}.leg b{color:var(--route);font-variant-numeric:tabular-nums}.leg.preview{border-style:dashed}.day-body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(230px,.55fr);gap:22px;padding:20px}.timeline{position:relative;padding-left:25px}.timeline:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:#cfd7c8}.stop{position:relative;padding:0 0 18px}.stop:last-child{padding-bottom:0}.stop:before{content:"";position:absolute;left:-22px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--day-color,var(--route));border:2px solid #fff;box-shadow:0 0 0 1px var(--day-color,var(--route))}.stop-time{font-size:10px;color:var(--day-color,var(--route));font-variant-numeric:tabular-nums}.stop h3{font-size:15px;margin:1px 0}.stop-address{font-size:10px;color:#8d9488}.stop p{font-size:12px;color:var(--muted);margin:5px 0 0}.side-stack{display:grid;align-content:start;gap:10px}.info{border:1px solid #dfe2d2;border-radius:11px;padding:12px 13px;background:#fbfbf3}.info h3{font-size:11px;margin:0 0 5px;color:#7e6444;letter-spacing:.08em}.info p,.info li{font-size:11px;margin:0;color:#5f6f62}.info ul{padding-left:17px;margin:0}.hotel{border-color:#b9d4e5;background:#f5fbff}.hotel h3{color:var(--stay)}.gallery{grid-column:1/-1;border-top:1px solid #ece8d8;padding-top:18px}.gallery h3{font-size:12px;margin:0 0 9px}.gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.gallery-item{border:0;padding:0;background:#eee3cf;border-radius:10px;overflow:hidden;text-align:left;cursor:pointer}.gallery-item img,.drawn-placeholder{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.drawn-placeholder{background:linear-gradient(145deg,#dae4c7,#9fc1b7);position:relative}.drawn-placeholder:after{content:"⌁ 旅行意象";position:absolute;inset:auto 8px 8px;color:#315b46;font:700 13px Georgia,serif}.gallery-cap{padding:7px 8px;background:#fff}.gallery-cap strong{display:block;font-size:10.5px}.gallery-cap span{font-size:9px;color:var(--muted)}.footnote{border-top:1px solid var(--line);padding:22px clamp(18px,4vw,54px) 40px;color:var(--muted);font-size:10.5px;display:flex;justify-content:space-between;gap:24px}.footnote p{margin:0;max-width:880px}
    .lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;background:#111e;backdrop-filter:blur(8px);padding:20px}.lightbox.open{display:flex}.lightbox img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:10px}.lightbox p{color:white;max-width:740px;text-align:center;font-size:13px}.lightbox-close{position:absolute;right:18px;top:18px;width:40px;height:40px;border:0;border-radius:50%;background:#ffffff20;color:white;font-size:24px;cursor:pointer}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:110;background:#253c31;color:white;border-radius:8px;padding:9px 15px;font-size:12px;display:none}.toast.show{display:block}
    @media(max-width:720px){.hero{padding-top:25px}.hero-row{display:block}.actions{margin-top:18px}.stats{gap:18px}.stat strong{font-size:23px}.day-body{grid-template-columns:1fr;padding:16px}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.day-head{padding:15px}.day-head h2{font-size:20px}.footnote{display:block}.footnote p+span{display:block;margin-top:12px}.map-section.stuck .map-viewport{height:min(66.6667vw,58vh)}}
    @media print{body,.page{background:white;box-shadow:none}.actions,.map-tools,.map-hint,.day-nav,.lightbox,.toast{display:none!important}.map-section,.map-section.stuck{position:relative;inset:auto;width:100%;margin:0;box-shadow:none}.map-placeholder.active{display:none}.map-viewport,.map-section.stuck .map-viewport{width:100%;height:auto;aspect-ratio:3/2}.map-stage{transform:none!important}.day-card{break-inside:avoid;box-shadow:none}.gallery-grid{grid-template-columns:repeat(4,1fr)}}
  __VISUAL_CSS__
</style>
</head>
<body>
  <div class="page">
    <header class="hero">

      <div class="hero-row">
        <div><h1>__TITLE__</h1><p>__SUBTITLE__</p></div>
        <div class="actions"><button class="action" id="copyBtn">复制行程</button><button class="action" onclick="window.print()">打印 / 存 PDF</button></div>
      </div>
      <div class="stats" id="stats"></div>
    </header>
    <div class="map-placeholder" id="mapPlaceholder"></div>
    <section class="map-section" id="mapSection" aria-label="交互行程地图">
      <div class="map-viewport" id="mapViewport">
        <div class="map-stage" id="mapStage">__MAP_SVG__</div>
        <div class="map-tools"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="resetMap" aria-label="复位">⌂</button></div>
        <div class="map-badge" id="zoomBadge">100%</div><div class="map-hint" id="mapHint">吸顶后可拖动 · Ctrl+滚轮或按钮缩放</div>
      </div>
      <div class="map-options"><button class="action" id="baseStyle" aria-pressed="false">查看原始底图</button><span>点地名查看行程 · 按钮 / Ctrl+滚轮缩放</span></div><nav class="day-nav" id="dayNav" aria-label="按天查看"></nav>
    </section>
    <main><div class="preview-warning" id="previewWarning">当前缺少真实路线或地理底图，仅供版式预览，不是正式行程地图。</div><section class="trip-notes"><h2>🧭 行程速览</h2><div id="overviewTable"></div></section><div id="days"></div></main>
    <footer class="footnote"><p id="sourceNote"></p><span>地理参考图 · 不替代实时导航</span></footer>
  </div>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true"><button class="lightbox-close" aria-label="关闭">×</button><img alt=""><p></p></div>
  <div class="toast" id="toast"></div>
  <script id="itineraryData" type="application/json">__ITINERARY_JSON__</script>
  <script>
  (()=>{
    const data=JSON.parse(document.getElementById('itineraryData').textContent);
    const colors=['#C45C38','#3B7C78','#8B6743','#667C4E','#8B5C75','#B57939','#3E6F91','#765F9B'];
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const duration=m=>m>=60?`${Math.floor(m/60)} 小时 ${m%60?Math.round(m%60)+' 分':''}`:`${Math.round(m)} 分钟`;
    const stats=$('#stats');
    stats.innerHTML=`<span>${data.days.length} 天行程</span><span>${Number(data.total_distance_km).toFixed(1)} km · 道路里程</span>${data.date_range?`<span>${safe(data.date_range)}</span>`:''}<span>📷 实景图集 · 点击预览</span>`;
    $('#previewWarning').classList.toggle('show',!!data.has_preview_routes||!!data.has_preview_basemaps);
    $('#overviewTable').innerHTML='<table><thead><tr><th>日期</th><th>核心行程</th><th>住宿</th><th>里程</th></tr></thead><tbody>'+data.days.map(d=>`<tr><td>Day ${safe(d.day)}</td><td>${safe(d.anchors||d.summary||d.title)}</td><td>${safe(d.lodging?.name||'—')}</td><td>${Number(d.distance_km).toFixed(1)} km</td></tr>`).join('')+'</tbody></table>';
    const nav=$('#dayNav'), daysRoot=$('#days');
    const infoBox=(title,content,klass='')=>content?`<section class="info ${klass}"><h3>${title}</h3>${content}</section>`:'';
    data.days.forEach((day,index)=>{
      const color=colors[index%colors.length];
      const pill=document.createElement('button'); pill.className='day-pill';pill.dataset.day=day.day;pill.textContent=`Day ${day.day}${day.date?' · '+day.date:''}`;nav.appendChild(pill);
      const stops=(day.stops||[]).map(stop=>`<article class="stop" data-name="${safe(stop.name)}"><div class="stop-time">${safe(stop.time||'时间灵活')}</div><h3>${safe(stop.name)}${stop.activity?` · ${safe(stop.activity)}`:''}</h3>${stop.address?`<div class="stop-address">${safe(stop.address)}</div>`:''}${stop.note?`<p>${safe(stop.note)}</p>`:''}</article>`).join('');
      const legs=(day.legs||[]).map(leg=>`<div class="leg ${leg.source==='preview-estimate'?'preview':''}">${safe(leg.from)} → ${safe(leg.to)} · <b>${Number(leg.distance_km).toFixed(1)} km</b> · ${duration(leg.duration_min)}${leg.source==='preview-estimate'?' · 预览估算':''}</div>`).join('');
      const lodging=day.lodging&&day.lodging.name?`<p><strong>${safe(day.lodging.name)}</strong><br>${safe(day.lodging.address||'')}${day.lodging.note?`<br>${safe(day.lodging.note)}`:''}</p>`:'';
      const meals=(day.meals||[]).length?`<ul>${day.meals.map(x=>`<li>${safe(x)}</li>`).join('')}</ul>`:'';
      const tips=(day.tips||[]).length?`<ul>${day.tips.map(x=>`<li>${safe(x)}</li>`).join('')}</ul>`:'';
      const gallery=(day.gallery||[]);
      const galleryHtml=gallery.length?`<section class="gallery"><h3>📷 景点实景 · ${gallery.length} 张 · 左右滑动</h3><div class="gallery-grid">${gallery.map((item,i)=>`<button class="gallery-item" data-gallery-day="${index}" data-gallery-index="${i}">${item.image?`<img src="${safe(item.image)}" alt="${safe(item.title||'行程图片')}" loading="lazy">`:'<span class="gallery-empty">照片待补充</span>'}<span class="gallery-cap"><strong>${safe(item.title||'实景照片')}</strong><span>${safe(item.caption||'实景照片')}</span></span></button>`).join('')}</div></section>`:'';
      const card=document.createElement('article');card.className='day-card';card.id=`day-${day.day}`;card.dataset.day=day.day;card.style.setProperty('--day-color',color);
      card.innerHTML=`<header class="day-head"><div><div class="day-kicker">DAY ${day.day}${day.date?' · '+safe(day.date):''}</div><h2>${safe(day.title)}</h2><div class="day-summary">${safe(day.summary||'')}</div></div><div class="day-total"><strong>${Number(day.distance_km).toFixed(1)} km</strong><span>${duration(day.duration_min)}</span></div></header>${legs?`<section class="legs"><div class="legs-title"><span>今日分段路线</span><span>${day.legs.length} 段</span></div><div class="leg-list">${legs}</div></section>`:''}${galleryHtml}<div class="day-body"><section class="timeline">${stops||'<p>当日暂无详细停靠点。</p>'}</section><aside class="side-stack">${infoBox('住宿',lodging,'hotel')}${infoBox('用餐',meals)}${infoBox('出行提示',tips)}</aside></div>`;
      const printMap=document.createElement('div');printMap.className='print-map';printMap.innerHTML=data.day_maps?.[String(day.day)]||'';card.querySelector('.day-head').after(printMap);
      daysRoot.appendChild(card);
    });
    $('#sourceNote').textContent=`路线：${data.route_provider||'输入数据'}；坐标系：${data.coordinate_system||'未注明'}；查询/整理日期：${data.route_queried_at||'未注明'}。地图底图保留真实地理信息；纸感只改变配色。地图装饰为特色意象且不按比例，正文照片不保证与出行季节一致；距离与时间请在出发前用实时导航复核。`;

    if(data.original_text){const original=document.createElement('details');original.className='original';const summary=document.createElement('summary');summary.textContent='查看原始行程';const pre=document.createElement('pre');pre.textContent=data.original_text;pre.style.whiteSpace='pre-wrap';original.append(summary,pre);$('main').appendChild(original)}
    const section=$('#mapSection'), placeholder=$('#mapPlaceholder'), viewport=$('#mapViewport'), stage=$('#mapStage'), badge=$('#zoomBadge'), hint=$('#mapHint');
    let naturalTop=0,naturalHeight=0,stuck=false,scale=1,tx=0,ty=0,drag=null,activeDay=Number(data.days[0].day),programmatic=false;
    const stageSize=()=>({w:viewport.clientWidth,h:viewport.clientWidth*.75});
    function limits(nextScale=scale){const s=stageSize(),vw=viewport.clientWidth,vh=viewport.clientHeight,sw=s.w*nextScale,sh=s.h*nextScale;return{minX:Math.min(0,vw-sw),maxX:Math.max(0,vw-sw),minY:Math.min(0,vh-sh),maxY:Math.max(0,vh-sh)}}
    function clamp(){const l=limits();tx=Math.min(l.maxX,Math.max(l.minX,tx));ty=Math.min(l.maxY,Math.max(l.minY,ty))}
    function render(animate=false){clamp();stage.classList.toggle('animating',animate);stage.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;badge.textContent=`${Math.round(scale*100)}%`;if(animate)setTimeout(()=>stage.classList.remove('animating'),390)}
    function zoomTo(next,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){next=Math.max(.35,Math.min(4,next));const wx=(cx-tx)/scale,wy=(cy-ty)/scale;tx=cx-wx*next;ty=cy-wy*next;scale=next;render(true);hint.classList.add('hidden')}
    function resetMap(animate=true){scale=1;tx=0;ty=0;render(animate)}
    function dayElements(day){return $$('.geo').filter(el=>(el.dataset.days||'').split(/\s+/).includes(String(day)))}
    function fitDay(day,animate=true){const els=dayElements(day).filter(el=>el.classList.contains('route-group')||el.classList.contains('stop-node')||el.classList.contains('lodging-node'));if(!els.length){resetMap(animate);return}let box=null;els.forEach(el=>{try{const b=el.getBBox();box=box?{x:Math.min(box.x,b.x),y:Math.min(box.y,b.y),x2:Math.max(box.x2,b.x+b.width),y2:Math.max(box.y2,b.y+b.height)}:{x:b.x,y:b.y,x2:b.x+b.width,y2:b.y+b.height}}catch{}});if(!box)return;const ratio=stageSize().w/1200,pad=70;const bw=Math.max(1,(box.x2-box.x)*ratio),bh=Math.max(1,(box.y2-box.y)*ratio);scale=Math.max(.35,Math.min(3.25,Math.min((viewport.clientWidth-pad)/bw,(viewport.clientHeight-pad)/bh)));tx=viewport.clientWidth/2-(box.x+box.x2)/2*ratio*scale;ty=viewport.clientHeight/2-(box.y+box.y2)/2*ratio*scale;render(animate)}
    function setDay(day,{fit=true}={}){activeDay=Number(day);if(data.day_maps?.[String(activeDay)])stage.innerHTML=data.day_maps[String(activeDay)];$$('.day-pill').forEach(el=>el.classList.toggle('active',Number(el.dataset.day)===activeDay));$$('.geo').forEach(el=>{const on=(el.dataset.days||'').split(/\s+/).includes(String(activeDay));el.classList.toggle('active',on);el.classList.toggle('dimmed',!on)});const p=$(`.day-pill[data-day="${activeDay}"]`);p?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});if(fit)requestAnimationFrame(()=>fitDay(activeDay,true))}
    nav.addEventListener('click',e=>{const p=e.target.closest('.day-pill');if(!p)return;programmatic=true;setDay(Number(p.dataset.day));$(`#day-${p.dataset.day}`)?.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>programmatic=false,650)});
    function measure(){if(!stuck){naturalTop=section.getBoundingClientRect().top+scrollY;naturalHeight=section.offsetHeight;placeholder.style.height=`${naturalHeight}px`}document.documentElement.style.setProperty('--map-h',`${section.offsetHeight}px`)}
    function setSticky(next){if(next===stuck)return;stuck=next;if(next){naturalHeight=section.offsetHeight;placeholder.style.height=`${naturalHeight}px`;placeholder.classList.add('active');section.classList.add('stuck')}else{section.classList.remove('stuck');placeholder.classList.remove('active');resetMap(false)}requestAnimationFrame(()=>{document.documentElement.style.setProperty('--map-h',`${section.offsetHeight}px`);fitDay(activeDay,false)})}
    function onScroll(){setSticky(scrollY>naturalTop+1);if(programmatic)return;const top=section.offsetHeight+18;let best=data.days[0].day,bestDist=Infinity;$$('.day-card').forEach(card=>{const r=card.getBoundingClientRect();const distance=Math.abs(r.top-top);if(r.bottom>top&&distance<bestDist){best=Number(card.dataset.day);bestDist=distance}});if(best!==activeDay)setDay(best)}
    let raf=0;addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;onScroll()})},{passive:true});addEventListener('resize',()=>{const was=stuck;if(was){section.classList.remove('stuck');placeholder.classList.remove('active');stuck=false}measure();onScroll();fitDay(activeDay,false)});
    viewport.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoomTo(scale*(e.deltaY<0?1.15:.87),e.offsetX,e.offsetY)},{passive:false});
    viewport.addEventListener('dblclick',e=>{zoomTo(scale<2?2:1,e.offsetX,e.offsetY)});
    viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button,.map-point'))return;if(!stuck&&scale===1)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty};viewport.setPointerCapture(e.pointerId);hint.classList.add('hidden')});
    viewport.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;render(false)});
    const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null};viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);
    $('#zoomIn').onclick=()=>zoomTo(scale*1.25);$('#zoomOut').onclick=()=>zoomTo(scale/1.25);$('#resetMap').onclick=()=>fitDay(activeDay,true);

    const lightbox=$('#lightbox');function closeLightbox(){lightbox.classList.remove('open')}daysRoot.addEventListener('click',e=>{const btn=e.target.closest('[data-gallery-day]');if(!btn)return;const item=data.days[Number(btn.dataset.galleryDay)].gallery[Number(btn.dataset.galleryIndex)];if(!item.image)return;$('img',lightbox).src=item.image;$('img',lightbox).alt=item.title||'行程图片';$('p',lightbox).textContent=[item.title,item.caption,item.author,item.license].filter(Boolean).join(' · ');const link=document.createElement('a');if(/^https?:\/\//.test(item.source_url||'')){link.href=item.source_url;link.textContent=' 查看图片来源 ↗';link.target='_blank';link.rel='noopener';$('p',lightbox).appendChild(link)}lightbox.classList.add('open')});$('.lightbox-close').onclick=closeLightbox;lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
    const toast=message=>{const el=$('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)};
    $('#copyBtn').onclick=async()=>{const text=[data.title,data.date_range||'',...data.days.map(day=>`Day ${day.day} ${day.title}\n${(day.legs||[]).map(l=>`${l.from} → ${l.to} ${Number(l.distance_km).toFixed(1)} km`).join('\n')}`)].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(text);toast('行程已复制')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'行程已复制':'复制不可用')}};
    $('#baseStyle').onclick=()=>{const on=stage.classList.toggle('original-basemap');$('#baseStyle').setAttribute('aria-pressed',String(on));$('#baseStyle').textContent=on?'回到纸感地图':'查看原始底图'};
    stage.addEventListener('click',e=>{const pin=e.target.closest('.map-point');if(!pin)return;const item=$$('.stop',$(`#day-${activeDay}`)).find(s=>s.dataset.name===pin.dataset.name);if(item){programmatic=true;item.scrollIntoView({behavior:'smooth',block:'start'});item.classList.add('stop-selected');setTimeout(()=>{item.classList.remove('stop-selected');programmatic=false},1400)}});
    stage.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.map-point')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
    setDay(activeDay,{fit:false});requestAnimationFrame(()=>{measure();onScroll();fitDay(activeDay,false)});
  })();
  </script>
</body>
</html>
